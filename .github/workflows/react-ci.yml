name : Enterprise React CI

on:
  push:
    branches: 
      - main
      - develop
  
  pull_request:
    branches: 
      - main
  jobs:
    validate-build: 
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
        
        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version-file: '.nvmrc'
            cache: 'npm'
        - name: Verify Node and npm versions
          run: |
            node -v
            npm -v   
        
        - name: Install dependencies
          run: npm ci
        - name: Run ESLint
          run: npm run lint  
        
        - name: Run Unit tests
          run: npm run test
        
        - name: Build application
          run: npm run build  
        - name: Upload build artifacts
          uses: actions/upload-artifact@v3
          with:
            name: react-build
            path: dist/   